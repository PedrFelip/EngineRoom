    <g id="app-icon">
      <rect id="tile-shadow" x="11" y="16" width="354" height="351" rx="82" fill="#100e0c" opacity=".48"/>
      <rect id="tile-face" x="11" y="9" width="354" height="348" rx="81" fill="url(#tile)"
