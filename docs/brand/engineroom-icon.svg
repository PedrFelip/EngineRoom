<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 376" role="img" aria-labelledby="title">
  <title id="title">Ícone do EngineRoom</title>
  <defs>
    <linearGradient id="ivory" x2="0" y2="1">
      <stop stop-color="#fff2db"/>
      <stop offset="1" stop-color="#f5e6cb"/>
    </linearGradient>
    <linearGradient id="lens" x2=".25" y2="1">
      <stop stop-color="#191613"/>
      <stop offset="1" stop-color="#27221c"/>
    </linearGradient>
    <linearGradient id="board" x2="0" y2="1">
      <stop stop-color="#34391d"/>
      <stop offset="1" stop-color="#4b5429"/>
    </linearGradient>
    <linearGradient id="board-depth" x2="0" y2="1">
      <stop stop-color="#2b2812" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2b2812" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lens-clip">
      <ellipse cx="520" cy="402" rx="160" ry="157"/>
    </clipPath>
    <g id="emblem">
      <rect id="handle" x="682" y="492" width="122" height="47" rx="19"
