      <ellipse id="lens-glass" cx="520" cy="402" rx="162" ry="159" fill="url(#lens)"/>
      <g id="chessboard" clip-path="url(#lens-clip)">
        <path id="board-ground" fill="url(#board)" d="M330 435h380v130H330z"/>
        <g id="back-rank" fill="#cdb38a">
          <path id="back-square-1" d="M333 435H380L329 468H265Z"/>
          <path id="back-square-3" d="M427 435H474L457 468H393Z"/>
          <path id="back-square-5" d="M521 435H568L585 468H521Z"/>
          <path id="back-square-7" d="M615 435H662L713 468H649Z"/>
        </g>
        <g id="middle-rank" fill="#cdb38a">
          <path id="middle-square-2" d="M329 468H393L349 510H263Z"/>
          <path id="middle-square-4" d="M457 468H521L521 510H435Z"/>
          <path id="middle-square-6" d="M585 468H649L693 510H607Z"/>
          <path id="middle-square-8" d="M713 468H777L865 510H779Z"/>
        </g>
        <g id="front-rank" fill="#cdb38a">
          <path id="front-square-1" d="M177 510H263L176 565H61Z"/>
          <path id="front-square-3" d="M349 510H435L406 565H291Z"/>
          <path id="front-square-5" d="M521 510H607L636 565H521Z"/>
          <path id="front-square-7" d="M693 510H779L866 565H751Z"/>
        </g>
        <path id="board-shadow" d="M330 435h380v130H330z" fill="url(#board-depth)"/>
