        <g id="rook-ivory" fill="url(#ivory)">
          <path id="crown" d="M457 301h28l.5 20H504v-20h36v20h18l1-20h27l-1 39q-1 12-13 12H470q-12 0-12-13z"/>
          <path id="shaft" d="M482 360h78v15q0 35 12 63 8 4 8 15H457q-1-13 12-15 13-28 13-63z"/>
          <path id="plinth" d="M455 462h123q12 0 12 13v16H443v-16q0-13 12-13z"/>
        </g>
        <g id="rook-shading" fill="#847453" opacity=".32">
          <path id="crown-shade" d="M551 321h7l1-20h27l-1 39q-1 12-13 12h-26q4-10 5-31z"/>
          <path id="shaft-shade" d="M523 360h37v15q0 35 12 63 8 4 8 15h-58v-13l14-3q-12-29-13-77z"/>
          <path id="plinth-shade" d="M522 462h56q12 0 12 13v16h-68z"/>
