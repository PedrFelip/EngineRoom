name: Rune installers

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'assets/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/rune-packaging.yml'
      - '.github/workflows/rune-installers.yml'

permissions:
  contents: read

jobs:
  installers:
    uses: ./.github/workflows/rune-installers.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source-dir: '.'
