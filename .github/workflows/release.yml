name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - app/package.json
      - app/src-tauri/tauri.conf.json
      - app/src-tauri/Cargo.toml
      - app/src-tauri/Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

# Serialize duplicate events and manual reruns for the same commit.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_id: ${{ steps.release.outputs.result }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release version selection
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate versions and detect bump
        id: version
        run: python .github/scripts/release_version.py

      - name: Create or resume version draft
        if: steps.version.outputs.should_release == 'true'
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.RELEASE_TAG
            const sha = process.env.RELEASE_SHA
            let ref
            try {
              ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (ref) {
              let object = ref.object
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object
              }
              if (object.type !== 'commit' || object.sha !== sha) {
                throw new Error(`${tag} already points to a different commit`)
              }
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha })
            }
            // Drafts are included for the authenticated token; paginate for older drafts.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 })
            const existing = releases.find(release => release.tag_name === tag)
            if (existing) {
              if (!existing.draft) throw new Error(`${tag} is already published`)
              return existing.id
            }
            const release = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              target_commitish: sha,
              name: `EngineRoom ${tag}`,
              body: 'Instaladores para Windows (NSIS/MSI) e Linux (AppImage). Inclui Stockfish 19 como sidecar.',
              draft: true,
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
            })
            return release.data.id

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Restore Stockfish sidecar cache
        id: stockfish-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src-tauri/binaries/stockfish-*
          key: stockfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/fetch-stockfish.mjs') }}

      - name: Fetch Stockfish sidecar
        run: bun scripts/fetch-stockfish.mjs
        working-directory: app

      # Save immediately so a later app build failure does not lose the download.
      - name: Save Stockfish sidecar cache
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src-tauri/binaries/stockfish-*
          key: ${{ steps.stockfish-cache.outputs.cache-primary-key }}

      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
