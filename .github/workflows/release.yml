name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release a retomar
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-rune-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      ENGINEROOM_PRODUCT: rune
    outputs:
      should_release: ${{ steps.draft.outputs.should_release }}
      release_id: ${{ steps.draft.outputs.release_id }}
      sha: ${{ steps.draft.outputs.sha }}
      tag: ${{ steps.draft.outputs.tag }}
      published: ${{ steps.draft.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Prepare version PR or draft release
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on bot PRs
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automation.cjs').checkReleasePRs({ github, context })
      # The tag is derived from the root Cargo.toml on push, or supplied on a
      # manual retry. No per-component output is needed for the root package.
      - name: Select or resume draft at its immutable commit
        id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            await require('./.github/scripts/automation.cjs').selectDraft({ github, context, core }, process.env.RELEASE_TAG || undefined)
      - name: Checkout exact release commit
        if: steps.draft.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.draft.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.draft.outputs.should_release == 'true'
        with:
          python-version: '3.12'
      - name: Validate tag, root manifest and changelog
        if: steps.draft.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: |
          python .github/scripts/release_version.py --product rune \
            --manifest .release-please-manifest.json --tag "$RELEASE_TAG"

  checks:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, checks]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/rune-installers.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, checks, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ENGINEROOM_PRODUCT: rune
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No latest.json: the first Rune release is a manual install.
      - name: Publish only with both installers present
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            await require('./.github/scripts/automation.cjs').publish(
              { github, context }, process.env.RELEASE_ID, process.env.RELEASE_TAG, process.env.RELEASE_SHA)

  sync:
    needs: [prepare, publish]
    if: always() && (needs.publish.result == 'success' || needs.prepare.outputs.published == 'true')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open synchronization PR and run its CI
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automation.cjs').syncDevelop({ github, context })
