name: Checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rune:
    name: Rune desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rune build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev mesa-vulkan-drivers vulkan-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: binaries/stockfish-*
          key: rune-stockfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-stockfish.mjs') }}
      - run: node --test scripts/fetch-stockfish.test.mjs
      - run: node scripts/fetch-stockfish.mjs
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Review with bundled Stockfish
        run: |
          export ENGINE_ROOM_STOCKFISH="$GITHUB_WORKSPACE/binaries/stockfish-$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked -p engineroom-rune real_stockfish -- --ignored --test-threads=1
      - name: Headless and responsive checks
        run: |
          ./scripts/check-headless.sh
          ./scripts/check-responsive.sh

  automation:
    name: Release automation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python .github/scripts/release_version.py --product rune
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-automation-${{ hashFiles('.github/scripts/bun.lock') }}
          restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-automation-
      - run: bun install --frozen-lockfile && bun run test
        working-directory: .github/scripts
