[workspace]
members = [
    "crates/engineroom-backend",
    "crates/engineroom-application",
    "crates/engineroom-ui",
    "crates/engineroom-sqlite",
    "crates/engineroom-uci",
]
default-members = ["."]
resolver = "2"

[profile.dev]
debug = 0
# Rune performs layout and scene construction on the UI thread, including in dev.
opt-level = 1

[package]
name = "engineroom-rune"
version = "3.0.0-alpha.3"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

build = "crates/engineroom-rune/build.rs"

[[bin]]
name = "engineroom-rune"
path = "crates/engineroom-rune/src/main.rs"

[dependencies]
rfd = "0.15"
rodio = "0.20"
unicode-normalization = "0.1"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
engineroom-backend = { path = "crates/engineroom-backend" }
engineroom-ui = { path = "crates/engineroom-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "b726a4d152512e51821884506776c3bad6b11410", default-features = false, features = ["svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b726a4d152512e51821884506776c3bad6b11410", default-features = false }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "b726a4d152512e51821884506776c3bad6b11410" }
pgn-reader = "0.29"
shakmaty = "0.30"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
