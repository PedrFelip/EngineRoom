[package]
name = "engineroom-application"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
engineroom-domain = { path = "../engineroom-domain" }
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
shakmaty = "0.30"

