[package]
name = "engineroom-uci"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
engineroom-domain = { path = "../engineroom-domain" }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
engineroom-application = { path = "../engineroom-application" }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
shakmaty = "0.30"
